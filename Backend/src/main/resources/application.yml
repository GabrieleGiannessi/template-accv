spring:
  application:
    name: squadtemplateAPI
  datasource:
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:squadtemplate}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: root
    password: ADMIN
  flyway:
    enabled: true
    locations: classpath:db/migration
  jooq:
    sql-dialect: mysql

server:
  port: ${PORT:8080}

resource-path: ${RESOURCE_PATH:C:/webdata/squadtemplate/}
competizioni-loghi: ${COMPETIZIONI_LOGHI:competizioni-loghi}
graphics:
  assets-path: ${GRAPHICS_ASSETS_PATH:../assets}
