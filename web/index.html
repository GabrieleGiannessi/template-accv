<!DOCTYPE html>
<html lang="it" class="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>ACCV Studio - Locandine & Grafiche Social ⚽</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN with White/Green/Gold ACCV custom theme -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            accvBg: '#f8fafc',
            accvCard: '#ffffff',
            accvCardSub: '#f1f5f9',
            accvBorder: '#e2e8f0',
            accvBorderDark: '#cbd5e1',
            accvGreen: '#10b981',        /* Colore secondario: Verde */
            accvGreenDark: '#059669',
            accvGreenLight: '#ecfdf5',
            accvGold: '#f59e0b',         /* Colore terzo: Oro */
            accvGoldDark: '#d97706',
            accvGoldLight: '#fef3c7',
            accvText: '#0f172a',
            accvMuted: '#64748b',
            accvRed: '#ef4444',
          },
          fontFamily: {
            header: ['"Bebas Neue"', 'sans-serif'],
            sans: ['Montserrat', 'sans-serif'],
          },
          boxShadow: {
            'card': '0 1px 3px 0 rgba(0, 0, 0, 0.07), 0 1px 2px 0 rgba(0, 0, 0, 0.04)',
            'card-hover': '0 4px 6px -1px rgba(0, 0, 0, 0.08), 0 2px 4px -1px rgba(0, 0, 0, 0.04)',
            'green-glow': '0 0 15px rgba(16, 185, 129, 0.25)',
            'gold-glow': '0 0 15px rgba(245, 158, 11, 0.25)',
          }
        }
      }
    }
  </script>

  <!-- React 18, ReactDOM and Babel Standalone -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    body {
      background-color: #f8fafc;
      color: #0f172a;
      font-family: 'Montserrat', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    /* Clean light scrollbars */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f5f9;
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #10b981;
    }

    .clean-card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.05);
    }

    .clean-input {
      background: #ffffff;
      border: 1px solid #cbd5e1;
      color: #0f172a;
      transition: all 0.15s ease;
    }
    .clean-input:focus {
      border-color: #10b981;
      box-shadow: 0 0 0 2px rgba(16, 185, 129, 0.2);
      outline: none;
    }

    /* Instagram Safe Zone overlay */
    .safe-zone-overlay {
      pointer-events: none;
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .safe-zone-top {
      height: 13%;
      background: repeating-linear-gradient(
        45deg,
        rgba(239, 68, 68, 0.12),
        rgba(239, 68, 68, 0.12) 10px,
        rgba(239, 68, 68, 0.22) 10px,
        rgba(239, 68, 68, 0.22) 20px
      );
      border-bottom: 2px dashed rgba(239, 68, 68, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #b91c1c;
      letter-spacing: 0.05em;
    }
    .safe-zone-bottom {
      height: 13%;
      background: repeating-linear-gradient(
        45deg,
        rgba(239, 68, 68, 0.12),
        rgba(239, 68, 68, 0.12) 10px,
        rgba(239, 68, 68, 0.22) 10px,
        rgba(239, 68, 68, 0.22) 20px
      );
      border-top: 2px dashed rgba(239, 68, 68, 0.7);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: #b91c1c;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased bg-accvBg text-accvText">
  <div id="root" class="flex-1 flex flex-col">
    <!-- Initial Loading Skeleton -->
    <div class="flex-1 flex flex-col items-center justify-center space-y-4 py-20">
      <div class="w-14 h-14 border-4 border-accvGreen border-t-transparent rounded-full animate-spin"></div>
      <h1 class="font-header text-3xl tracking-widest text-accvGreenDark">ACCV SOCIAL GRAPHICS STUDIO</h1>
      <p class="text-sm text-accvMuted">Caricamento studio grafico calcetto...</p>
    </div>
  </div>

  <!-- React 18 SPA script -->
  <script type="text/babel" src="/app.jsx"></script>
</body>
</html>
